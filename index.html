<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinSuccess · Investment Dashboards · VHM · VRE · VPL</title>
<meta name="description" content="Bộ dashboard phân tích đầu tư cổ phiếu Việt Nam của FinSuccess — Vinhomes (VHM), Vincom Retail (VRE), Vinpearl (VPL).">
<style>
:root{--navy:#201D5E;--green:#82BC28;--gold:#F3A712;--line:#e3e8f0;--bg:#f4f6fa;--mut:#6b7789}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#1a1f2b;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55;display:flex;flex-direction:column}

.bar{background:var(--navy);flex:0 0 auto;display:flex;align-items:stretch;overflow-x:auto;box-shadow:0 1px 4px rgba(20,25,45,.18);position:relative;z-index:5}
.mark{display:flex;flex-direction:column;justify-content:center;padding:8px 20px 8px 20px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.13)}
.mark .w{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.15}
.mark .w i{font-style:normal;color:var(--green)}
.mark .s{font-size:9.5px;color:#b7b3e0;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

.bar button{background:transparent;border:0;border-bottom:3px solid transparent;color:#b7b3e0;padding:9px 20px;cursor:pointer;text-align:left;white-space:nowrap;font-family:inherit;transition:.15s;display:flex;flex-direction:column;gap:1px;min-width:148px}
.bar button .tk{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.bar button .co{font-size:10.5px;opacity:.85;font-weight:500}
.bar button:hover{color:#fff;background:rgba(255,255,255,.06)}
.bar button.on{color:#fff;border-bottom-color:var(--green);background:rgba(255,255,255,.09)}
.bar button.soon .tk::after{content:"SẮP CÓ";font-size:8px;font-weight:800;background:rgba(243,167,18,.25);border:1px solid rgba(243,167,18,.55);color:#ffd98a;border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle;letter-spacing:.04em}
.bar .spacer{flex:1 1 auto}
.bar .ext{display:flex;align-items:center;padding:0 16px}
.bar .ext a{color:#b7b3e0;font-size:11px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 11px;white-space:nowrap}
.bar .ext a:hover{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08)}

.stage{flex:1 1 auto;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2;transition:opacity .25s}
.load.gone{opacity:0;pointer-events:none}
.load .sp{width:30px;height:30px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load .box{text-align:center;color:var(--mut)}
.load b{color:var(--navy);display:block;font-size:13px;margin-bottom:3px}
.load small{font-size:11.5px}
noscript{display:block;padding:16px 20px;background:#fceded;font-size:13px}
noscript a{color:#2E75B6;font-weight:700}
@media(max-width:680px){
 .mark{padding:7px 13px}.mark .w{font-size:13px}.mark .s{display:none}
 .bar button{min-width:106px;padding:8px 13px}
 .bar button .tk{font-size:14px}.bar button .co{font-size:9.5px}
 .bar .ext{display:none}
}
</style></head><body>

<div class="bar" id="bar">
  <div class="mark"><span class="w">Fin<i>Success</i></span><span class="s">Investment Dashboards</span></div>
  <button data-k="vhm" class="on"><span class="tk">VHM</span><span class="co">Vinhomes · hoá tiền quỹ đất</span></button>
  <button data-k="vre"><span class="tk">VRE</span><span class="co">Vincom Retail · năng suất mỗi m²</span></button>
  <button data-k="vpl"><span class="tk">VPL</span><span class="co">Vinpearl · RevPAR &amp; khúc quanh BĐS</span></button>
  <div class="spacer"></div>
  <div class="ext"><a id="openNew" href="vhm.html" target="_blank" rel="noopener">Mở toàn màn hình ↗</a></div>
</div>

<noscript>Trang này dùng JavaScript để chuyển giữa các dashboard. Bạn có thể mở trực tiếp:
  <a href="vhm.html">Dashboard VHM</a> · <a href="vre.html">Dashboard VRE</a> · <a href="vpl.html">VPL</a>.</noscript>

<div class="stage">
  <div class="load" id="load"><div class="box"><div class="sp"></div><b id="loadT">Đang tải dashboard…</b><small>Lần đầu tải có thể mất vài giây</small></div></div>
  <iframe id="frame" title="Dashboard" src="vhm.html"></iframe>
</div>

<script>
(function(){
 var TABS={
  vhm:{src:'vhm.html',name:'VHM · Vinhomes'},
  vre:{src:'vre.html',name:'VRE · Vincom Retail'},
  vpl:{src:'vpl.html',name:'VPL · Vinpearl'}
 };
 var frame=document.getElementById('frame'), load=document.getElementById('load'),
     loadT=document.getElementById('loadT'), openNew=document.getElementById('openNew'),
     btns=[].slice.call(document.querySelectorAll('.bar button'));

 function show(k,push){
  if(!TABS[k]) k='vhm';
  var t=TABS[k];
  btns.forEach(function(b){ b.classList.toggle('on', b.dataset.k===k); });
  loadT.textContent='Đang tải dashboard '+t.name+'…';
  if(frame.getAttribute('src')!==t.src){ load.classList.remove('gone'); frame.setAttribute('src',t.src); }
  else { load.classList.add('gone'); }
  openNew.href=t.src;
  document.title='FinSuccess · '+t.name;
  if(push && location.hash!=='#'+k) history.replaceState(null,'','#'+k);
 }
 frame.addEventListener('load',function(){ load.classList.add('gone'); });
 btns.forEach(function(b){ b.addEventListener('click',function(){ show(b.dataset.k,true); }); });
 window.addEventListener('hashchange',function(){ show((location.hash||'#vhm').slice(1),false); });

 show((location.hash||'#vhm').slice(1),true);
 setTimeout(function(){ load.classList.add('gone'); },10000);
})();
</script>
</body></html>
